# /etc/nginx/sites-available/media-labs.conf
# HTTP-only bootstrap — SSL activé après DNS + certbot
#
# media-labs.is-a.dev          → RADAR (port 3000) — entry point
# studio.media-labs.is-a.dev   → STUDIO (port 3002)

# ── RADAR (port 3000) ──
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name media-labs.is-a.dev radar.media-labs.is-a.dev _;

    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

# ── STUDIO (port 3002) ──
server {
    listen 80;
    listen [::]:80;
    server_name studio.media-labs.is-a.dev;

    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
