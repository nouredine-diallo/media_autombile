# /etc/nginx/sites-available/media-labs.conf
# Subdomain routing for media-labs.is-a.dev
#
# media-labs.is-a.dev          → RADAR (port 3001) — entry point
# radar.media-labs.is-a.dev    → RADAR (port 3001)
# studio.media-labs.is-a.dev   → STUDIO (port 3002)

# ── HTTP → HTTPS redirect (sauf challenge ACME pour Let's Encrypt) ──
server {
    listen 80;
    listen [::]:80;
    server_name media-labs.is-a.dev *.media-labs.is-a.dev;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── RADAR (base domain + radar.*) ──
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name media-labs.is-a.dev radar.media-labs.is-a.dev;

    ssl_certificate /etc/letsencrypt/live/media-labs.is-a.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/media-labs.is-a.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

# ── STUDIO ──
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name studio.media-labs.is-a.dev;

    ssl_certificate /etc/letsencrypt/live/media-labs.is-a.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/media-labs.is-a.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

# ── Wildcard fallback ──
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;

    ssl_certificate /etc/letsencrypt/live/media-labs.is-a.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/media-labs.is-a.dev/privkey.pem;

    return 301 https://media-labs.is-a.dev;
}
