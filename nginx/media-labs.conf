# /etc/nginx/sites-available/media-labs.conf
# HTTP-only bootstrap — SSL activé après DNS + certbot
#
# http://89.168.53.133.nip.io/        → RADAR  (127.0.0.1:3000) via nginx
# http://studio.89.168.53.133.nip.io/ → STUDIO (127.0.0.1:3002) via nginx
#
# Port 3002 direct (http://IP:3002) est bloqué par la Security List Oracle Cloud
# (firewall niveau VCN, distinct d'iptables sur la VM) — confirmé le 2026-08-27,
# port 22 et 3002 timeout depuis l'extérieur alors que 80 répond. Router STUDIO
# par nginx sur le port 80, déjà ouvert, évite d'avoir à toucher la Security List.
# Sous-domaine nip.io choisi plutôt qu'un préfixe de chemin (/studio) : un essai
# précédent avec basePath a été abandonné (voir git log studio/next.config.ts) —
# un sous-domaine ne touche pas aux chemins d'assets Next.js ni aux cookies de
# session, un préfixe de chemin si.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name studio.89.168.53.133.nip.io;

    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
