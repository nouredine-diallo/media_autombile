# /etc/nginx/sites-available/media-labs.conf — conf finale HTTPS
#
# Installée par setup-ssl.sh UNE FOIS les certificats Let's Encrypt obtenus
# pour les domaines nip.io réellement utilisés en prod (audit du 2026-09-07,
# finding A1 : le fichier précédent — media-labs.conf, gardé comme bootstrap
# HTTP tel quel — était copié tel quel par setup-ssl.sh comme "conf SSL
# finale" alors qu'il n'a jamais eu de bloc `listen 443` ni de directive
# `ssl_certificate` : le script n'aurait donc jamais réellement activé
# HTTPS. Corrigé en séparant clairement bootstrap (HTTP seul) et conf finale
# (ce fichier).
#
# http://89.168.53.133.nip.io/        → redirigé vers https, sert aussi le
#                                        challenge ACME (renouvellement)
# https://89.168.53.133.nip.io/       → RADAR  (127.0.0.1:3000)
# https://studio.89.168.53.133.nip.io/→ STUDIO (127.0.0.1:3002)
#
# Certificat unique multi-SAN, nommé d'après le premier -d de la commande
# certbot dans setup-ssl.sh (89.168.53.133.nip.io) — c'est ce nom qui
# détermine le dossier sous /etc/letsencrypt/live/.

# ── HTTP : challenge ACME + redirection vers HTTPS ──
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS : RADAR ──
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name 89.168.53.133.nip.io;

    ssl_certificate     /etc/letsencrypt/live/89.168.53.133.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/89.168.53.133.nip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Finding A1 : le cookie de session et le mot de passe d'équipe ne
    # doivent plus jamais pouvoir circuler en clair une fois ce bloc actif.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

# ── HTTPS : STUDIO ──
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name studio.89.168.53.133.nip.io;

    ssl_certificate     /etc/letsencrypt/live/89.168.53.133.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/89.168.53.133.nip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
